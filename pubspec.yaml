name: face_privacy
description: On-device face detection + selective FDAE (DNA/chaos) encryption of face regions.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  image: ^4.2.0          # decode / orient / resize / PNG encode (pure Dart)
  crypto: ^3.0.3         # sync HMAC-SHA256 for PBKDF2 + per-face key expansion
  tflite_flutter: ^0.12.1
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  sqflite: ^2.3.3
  flutter_secure_storage: ^9.2.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  assets:
    # put your exported face model here (float32 or float16, NOT int8 -- see README)
    - assets/models/
