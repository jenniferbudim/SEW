name: face_privacy
description: On-device face detection + selective FDAE (DNA/chaos) encryption of face regions.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  image: ^4.2.0          # decode / orient / resize / PNG encode (pure Dart)
  flutter_svg: ^2.0.10+1
  crypto: ^3.0.3         # sync HMAC-SHA256 for PBKDF2 + per-face key expansion
  # >=0.12.1 bundles Google LiteRT 1.4.0 (0.11.x bundles TFLite 2.12.0, which likely cannot run models from the
  # new litert_torch exporter). It does NOT fix the 'Inconsistent JVM target' Gradle error by itself -- see README.
  tflite_flutter: ^0.12.1
  camera: ^0.11.0        # live preview + capture (Android SDK 24+, iOS 13+). If pub rejects it for your
                         # Flutter version, run `flutter pub add camera` to let pub choose a compatible one.
  path_provider: ^2.1.3
  file_picker: ^8.3.7   # "save as" dialog for the metrics CSV/JSON download
  sqflite: ^2.3.3
  flutter_secure_storage: ^9.2.2
  path: ^1.9.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: 0.14.4

flutter:
  assets:
    # put your exported face model here (float32 or float16, NOT int8 -- see README)
    - assets/models/
    - assets/images/
    - assets/icons/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"